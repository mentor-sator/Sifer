name: sifer-observability

services:
  lgtm:
    image: grafana/otel-lgtm:0.33.1@sha256:d6c52678ab5b7144f27ae569fd778608121c0f4a10eb411983750a0d67c1fbe3
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    mem_limit: 2g
    healthcheck:
      test: ['CMD', '/otel-lgtm/docker/healthcheck.sh']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 180s

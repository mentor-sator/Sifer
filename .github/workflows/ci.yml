name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Verify (format, lint, typecheck, test, contracts, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: buf 1.47.2 (checksum verified)
        run: |
          curl --fail --silent --show-error --location --retry 3 -o /tmp/buf https://github.com/bufbuild/buf/releases/download/v1.47.2/buf-Linux-x86_64
          echo "3a0c4da8d46eea8136affa63db202c76a44f8112384160b73c3fffb1cf14b5d8  /tmp/buf" | sha256sum --check --strict
          sudo install -m 0755 /tmp/buf /usr/local/bin/buf
          buf --version

      - name: pnpm/action-setup v6.1.0 (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: actions/setup-node v7.0.0 (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: actions/setup-go v7.0.0 (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify (format, lint, typecheck, test)
        run: pwsh -NoProfile -File tools/Verify.ps1

      - name: Contracts (buf breaking against the previous state of main)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          if git cat-file -e "${BASE}:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#ref=${BASE}"
          else
            echo "no buf.yaml at ${BASE}; nothing to compare"
          fi

      - name: Generated code matches the contracts
        run: |
          buf generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "generated code is stale: run 'just gen' and commit"
            exit 1
          fi
      - name: Build
        run: pnpm build

  compose:
    name: Container stack (docker-compose.yml)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Generate throwaway credentials
        run: |
          for name in POSTGRES_PASSWORD REDIS_PASSWORD QDRANT_API_KEY SILO_ROOT_PASSWORD LIVEKIT_API_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Smoke test
        run: |
          docker compose exec -T postgres pg_isready -U postgres
          docker compose exec -T redis sh -c 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping' | grep -q PONG
          curl --fail --silent --show-error -H "api-key: $QDRANT_API_KEY" http://127.0.0.1:6333/collections
          curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live
          curl --fail --silent --show-error http://127.0.0.1:7880/
          docker compose exec -T -e PGPASSWORD="$POSTGRES_PASSWORD" postgres psql -h pgbouncer -p 6432 -U postgres -d postgres -tAc 'select 1' | grep -qx 1

      - name: Atlas CLI (arigaio/atlas 1.3.3, pinned by digest)
        run: |
          sudo tee /usr/local/bin/atlas > /dev/null <<'EOF'
          #!/bin/sh
          exec docker run --rm --network host -v "$PWD:/work" -w /work arigaio/atlas:1.3.3@sha256:07f3f92fa46e684ed789d5ef344a25494a4fa6844ef1ea1fa4e138522c2c37ac "$@"
          EOF
          sudo chmod +x /usr/local/bin/atlas
          atlas version

      - name: Seed against containerised PostgreSQL
        shell: pwsh
        run: |
          Import-Module ./tools/Database.psm1 -Force
          $target = Get-SiferDbTarget -Port 5432 -Password $env:POSTGRES_PASSWORD
          Reset-SiferDatabase -Target $target
          $schemas = @(Get-SiferDbSchemas -Target $target)
          $expected = @(Get-ChildItem db/migrations -Directory | ForEach-Object Name)
          $missing = @($expected | Where-Object { $_ -notin $schemas })
          if ($missing.Count -gt 0) { throw "Schemas missing after seed: $($missing -join ', ')" }
          "schemas present: $($expected -join ', ')"
          Invoke-SiferMigrate -Target $target
          Reset-SiferDatabase -Target $target
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes

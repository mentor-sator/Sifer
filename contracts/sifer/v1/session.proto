syntax = "proto3";

package sifer.v1;

enum SessionKind {
  SESSION_KIND_UNSPECIFIED = 0;
  SESSION_KIND_ADIUTOR = 1;
  SESSION_KIND_MOBILE_LIVE = 2;
  SESSION_KIND_VIDE_APPICA = 3;
  SESSION_KIND_COMITIS = 4;
}

enum SessionMode {
  SESSION_MODE_UNSPECIFIED = 0;
  SESSION_MODE_GUIDED = 1;
  SESSION_MODE_OBSERVED = 2;
  SESSION_MODE_DELEGATED = 3;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_STARTING = 1;
  SESSION_STATE_PLANNING = 2;
  SESSION_STATE_RUNNING = 3;
  SESSION_STATE_PAUSED = 4;
  SESSION_STATE_AWAITING_USER = 5;
  SESSION_STATE_COMPLETED = 6;
  SESSION_STATE_ABANDONED = 7;
  SESSION_STATE_FAILED = 8;
}

enum StepState {
  STEP_STATE_UNSPECIFIED = 0;
  STEP_STATE_PENDING = 1;
  STEP_STATE_INSTRUCTED = 2;
  STEP_STATE_IN_PROGRESS = 3;
  STEP_STATE_VERIFIED = 4;
  STEP_STATE_FAILED = 5;
  STEP_STATE_DELEGATED = 6;
  STEP_STATE_SKIPPED = 7;
}

message SessionControl {}

message ScreenSnapshot {}

message StepChange {}

message OverlayCommand {}

message SpeechChunk {}

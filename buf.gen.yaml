version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/mentor-sator/Sifer/gen/go
plugins:
  - remote: buf.build/bufbuild/es:v2.15.0
    out: packages/contracts-ts/src/gen
    opt:
      - target=ts
      - import_extension=js
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/python:v36.2
    out: gen/py
  - remote: buf.build/grpc/python:v1.84.0
    out: gen/py
  - remote: buf.build/community/nipunn1313-mypy:v5.1.0
    out: gen/py
  - remote: buf.build/community/nipunn1313-mypy-grpc:v5.1.0
    out: gen/py
inputs:
  - directory: contracts
